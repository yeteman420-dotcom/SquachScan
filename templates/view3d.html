<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Your 3D Foot — ModToes Scanner v{{ version }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1e33; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; touch-action: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px;
         background: linear-gradient(to bottom, rgba(10,20,40,.85), transparent);
         pointer-events: none; z-index: 10; }
  #hud h1 { font-size: 18px; font-weight: 700; }
  #hud p { font-size: 13px; opacity: .75; margin-top: 4px; }
  #hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
          font-size: 13px; opacity: .6; pointer-events: none; z-index: 10; }
  #dl { position: fixed; bottom: 52px; left: 0; right: 0; text-align: center; z-index: 10; }
  #dl a { display: inline-block; background: #2b6cb0; color: #fff; text-decoration: none;
          padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  #status { position: fixed; top: 45%; left: 0; right: 0; text-align: center;
            font-size: 15px; opacity: .8; pointer-events: none; z-index: 10; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
<div id="hud">
  <h1>Your 3D Foot</h1>
  <p>ModToes Scanner v{{ version }} &bull; drag to rotate &bull; pinch to zoom</p>
</div>
<div id="status">Loading 3D model...</div>
<div id="hint">Drag to spin &bull; pinch to zoom</div>
<div id="dl"><a href="/api/3d-model" download="foot-3d.obj">Download 3D model</a></div>
<canvas id="c"></canvas>
<script>
(function() {
const statusEl = document.getElementById('status');
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch(e) {
  statusEl.textContent = 'WebGL not available on this device.';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1e33);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100000);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const k1 = new THREE.DirectionalLight(0xffffff, 0.9); k1.position.set(1, 2, 1.5); scene.add(k1);
const k2 = new THREE.DirectionalLight(0x88aaff, 0.4); k2.position.set(-1.5, 0.5, -1); scene.add(k2);

// Simple orbit: drag rotate, wheel/pinch zoom
let theta = 0.7, phi = 1.1, dist = 800;
function applyCam() {
  camera.position.set(
    dist * Math.sin(phi) * Math.sin(theta),
    dist * Math.cos(phi),
    dist * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(0, 0, 0);
}
let pdown = false, px = 0, py = 0, pinch0 = 0;
canvas.addEventListener('pointerdown', e => { pdown = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => pdown = false);
canvas.addEventListener('pointercancel', () => pdown = false);
canvas.addEventListener('pointermove', e => {
  if (!pdown) return;
  theta -= (e.clientX - px) * 0.009;
  phi = Math.min(2.9, Math.max(0.15, phi - (e.clientY - py) * 0.007));
  px = e.clientX; py = e.clientY;
  applyCam();
});
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch0 > 0) dist = Math.min(4000, Math.max(150, dist * pinch0 / Math.max(d, 1)));
    pinch0 = d;
    applyCam();
  }
}, {passive: false});
canvas.addEventListener('touchend', () => pinch0 = 0);
canvas.addEventListener('wheel', e => { dist = Math.min(4000, Math.max(150, dist * (1 + e.deltaY * 0.001))); applyCam(); }, {passive: true});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
applyCam();
animate();

statusEl.textContent = 'Loading 3D model...';
const loader = new THREE.OBJLoader();
loader.load('/api/3d-model',
  function(obj) {
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    obj.traverse(function(child) {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({ color: 0xd9a066, roughness: 0.65, metalness: 0.08 });
      }
    });
    scene.add(obj);
    const size = box.getSize(new THREE.Vector3()).length();
    dist = size * 1.4;
    applyCam();
    statusEl.style.display = 'none';
  },
  function(xhr) {
    if (xhr.loaded && xhr.total) statusEl.textContent = 'Loading ' + Math.round(xhr.loaded/xhr.total*100) + '%...';
  },
  function(err) {
    statusEl.textContent = 'Could not load 3D model. Try the download button below.';
  }
);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
</script>
</body>
</html>
